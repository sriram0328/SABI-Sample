<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>
    <!-- Google Fonts Link for Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="css/navbar.css">
 

  
    
<style>


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: #f4f4f4;
    padding-top: 70px; /* To prevent content from being hidden behind the fixed navbar */
}



/* Responsive Styles */
@media (max-width: 768px) {
    .navbar {
        padding: 10px;
    }

    .hamburger {
        display: flex;  /* Show hamburger only on mobile */
        align-items: center;
        justify-content: center;
    }

    .menu {
        display: none;
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        width: 100%;
        background-color: #7c2148;
        flex-direction: column;
        align-items: center;
        padding-top: 60px;
        gap: 20px;
        z-index: 1001;
        transform: translateX(100%);
        transition: transform 0.6s ease-in-out;
    }

    .menu.active {
        display: flex;
        transform: translateX(0);
    }

    .menu-item {
        padding: 10px 20px;
        font-size: 18px;
        width: 200px;
        text-align: center;
    }

    .menu-item:hover {
        background-color: white;
        color: #7c2148;
        border-radius: 30px;
    }
    .hamburger.cross {
        content: '\2715';
        font-size: 24px;
        right: 15px;
    }
}

 

/* CONTACT FORM STYLING */
.contact-form {
    width: 100%;
    max-width: 500px;
    background: linear-gradient(135deg, #7c2148, #a8325f);
    padding: 25px 30px;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    margin: 60px auto;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    animation: fadeIn 0.6s ease-in-out;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Card hover effect */
.contact-form:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25),
                0 0 12px rgba(255, 102, 153, 0.3);
}

.contact-form h2 {
    text-align: center;
    color: #fff;
    margin-bottom: 20px;
    font-size: 24px;
    letter-spacing: 1px;
}

.contact-form label {
    display: block;
    margin: 12px 0 6px;
    color: #f1f1f1;
    font-weight: 500;
}

.contact-form input[type="text"],
.contact-form input[type="email"],
.contact-form textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    resize: vertical;
    font-size: 15px;
    transition: border 0.3s ease, box-shadow 0.3s ease;
}

/* Input focus effect */
.contact-form input[type="text"]:focus,
.contact-form input[type="email"]:focus,
.contact-form textarea:focus {
    border-color: #ff6699;
    box-shadow: 0 0 6px rgba(255, 102, 153, 0.4);
    outline: none;
}

/* Button styling */
.contact-form button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #4CAF50, #2e7d32);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 20px;
    transition: background 0.3s ease, transform 0.2s ease;
}

/* Button hover + click animation */
.contact-form button:hover {
    background: linear-gradient(135deg, #45a049, #256d29);
    transform: translateY(-2px);
}
.contact-form button:active {
    transform: translateY(1px);
}

/* Fade-in animation */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>
    
<body>
    <nav class="navbar">
        <div class="navbar-logo"><img src="Abida 60px.png" alt=""></div>
        <div class="hamburger" onclick="toggleMenu()">&#9776;</div> <!-- Hamburger menu -->
        <div class="menu">
            <a href="index.html" class="menu-item">Home</a>
            <a href="academy.html" class="menu-item">Training Institute</a>
            <a href="gallery.html" class="menu-item">Gallery</a>
            <a href="contact.html" class="menu-item">Contact Us</a>
        </div>
    </nav>
    
    <script src="js/navbar.js"></script>
    

<div class="contact-form">
    <h2>Contact Us</h2>
    <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>
 

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
